name: bank-term-deposit

services:
  postgres-dwh:
    image: postgres:16
    container_name: bank-postgres-dwh
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: dwh
    ports:
      - "5432:5432"
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dwh"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-airflow:
    profiles: ["airflow"]
    image: postgres:16
    container_name: bank-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    profiles: ["airflow"]
    build:
      context: ./docker/airflow
    container_name: bank-airflow-init
    depends_on:
      postgres-airflow:
        condition: service_healthy
      postgres-dwh:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__WEBSERVER__SECRET_KEY: lab_secret_key
      AIRFLOW_CONN_DWH_POSTGRES: postgresql://admin:admin@postgres-dwh:5432/dwh
      PYTHONPATH: /opt/airflow
    command: >
      bash -c "
      airflow db migrate &&
      airflow users list | grep -q admin ||
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      "
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/jobs:/opt/airflow/jobs
      - ./airflow/logs:/opt/airflow/logs
      - ./models:/opt/airflow/models

  airflow-webserver:
    profiles: ["airflow"]
    build:
      context: ./docker/airflow
    container_name: bank-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-dwh:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: lab_secret_key
      AIRFLOW_CONN_DWH_POSTGRES: postgresql://admin:admin@postgres-dwh:5432/dwh
      PYTHONPATH: /opt/airflow
    command: webserver
    ports:
      - "8088:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/jobs:/opt/airflow/jobs
      - ./airflow/logs:/opt/airflow/logs
      - ./models:/opt/airflow/models

  airflow-scheduler:
    profiles: ["airflow"]
    build:
      context: ./docker/airflow
    container_name: bank-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-dwh:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: lab_secret_key
      AIRFLOW_CONN_DWH_POSTGRES: postgresql://admin:admin@postgres-dwh:5432/dwh
      PYTHONPATH: /opt/airflow
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/jobs:/opt/airflow/jobs
      - ./airflow/logs:/opt/airflow/logs
      - ./models:/opt/airflow/models

volumes:
  postgres_dwh_data:
  postgres_airflow_data:
